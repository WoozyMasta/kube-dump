---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-dump-resources

rules:
  # Objects selected by the built-in backup and export profiles.
  - apiGroups: [""]
    resources:
      - configmaps
      - limitranges
      - namespaces
      - persistentvolumeclaims
      - resourcequotas
      - secrets
      - serviceaccounts
      - services
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, statefulsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses, networkpolicies]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources:
      - backendtlspolicies
      - gateways
      - gatewayclasses
      - grpcroutes
      - httproutes
      - referencegrants
      - tcproutes
      - tlsroutes
      - udproutes
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings, clusterroles, rolebindings, roles]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]

  # Optional operator resources listed by the built-in profiles.
  - apiGroups:
      - monitoring.coreos.com
      - cert-manager.io
      - external-secrets.io
      - argoproj.io
      - source.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
    resources: ["*"]
    verbs: [get, list]

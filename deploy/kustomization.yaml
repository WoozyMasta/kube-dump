---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

images:
  - name: ghcr.io/woozymasta/kube-dump
    newTag: &version 2.0.0-rc.1

labels:
  - pairs:
      app.kubernetes.io/name: kube-dump
    includeSelectors: true
  - pairs:
      app.kubernetes.io/version: *version
      app.kubernetes.io/part-of: kube-dump

buildMetadata:
  - managedByLabel

configMapGenerator:
  - name: kube-dump
    literals:
      - KUBE_DUMP_LOG_LEVEL=info
      - KUBE_DUMP_LOG_FORMAT=json
      - KUBE_DUMP_NO_PROGRESS=true
      - KUBE_DUMP_VOLUME_COMPRESSION=zstd
    options:
      # A stable name is sufficient for one-shot CronJobs and Pods.
      disableNameSuffixHash: true
